name: Windows Pi nightly

on:
  workflow_dispatch:
  schedule:
    # Fork workflows cannot receive upstream push events directly; poll hourly.
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  check-upstream:
    name: Check upstream main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
    steps:
      - id: check
        name: Check for a new upstream commit
        uses: actions/github-script@v8
        with:
          script: |
            const upstream = await github.rest.repos.getCommit({
              owner: "pingdotgg",
              repo: "t3code",
              ref: "main",
            });
            const upstreamSha = upstream.data.sha;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const latestPiNightly = releases.find(
              (release) =>
                release.prerelease &&
                !release.draft &&
                release.name.startsWith("T3 Code Pi Nightly") &&
                /upstream-main-sha: [0-9a-f]{40}/i.test(release.body ?? ""),
            );
            const previousSha = latestPiNightly?.body?.match(
              /upstream-main-sha: ([0-9a-f]{40})/i,
            )?.[1];
            const shouldBuild = context.eventName !== "schedule" || previousSha !== upstreamSha;
            core.setOutput("should_build", String(shouldBuild));
            core.setOutput("upstream_sha", upstreamSha);
            core.notice(
              `${shouldBuild ? "Building" : "Skipping"} upstream main ${upstreamSha}`,
            );

  build-wsl-node-pty:
    name: Build WSL node-pty (linux-x64)
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/pi-provider
          fetch-depth: 0

      - name: Merge latest upstream main
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags upstream main
          git -c user.name=t3-ci -c user.email=t3-ci@users.noreply.github.com merge --no-commit --no-ff upstream/main

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Build node-pty linux-x64 prebuild
        shell: bash
        run: |
          set -euo pipefail
          pty_pkg="$(node -e "console.log(require.resolve('node-pty/package.json', { paths: ['$GITHUB_WORKSPACE/apps/server'] }))")"
          pty_dir="$(dirname "$pty_pkg")"
          ( cd "$pty_dir" && npx --yes node-gyp rebuild )
          mkdir -p wsl-prebuild
          cp "$pty_dir/build/Release/pty.node" wsl-prebuild/pty.node
          file wsl-prebuild/pty.node

      - name: Upload node-pty prebuild
        uses: actions/upload-artifact@v4
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild/pty.node
          if-no-files-found: error

  build:
    name: Build Windows installer
    needs: [check-upstream, build-wsl-node-pty]
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      upstream_sha: ${{ needs.check-upstream.outputs.upstream_sha }}
    env:
      # These are public identifiers, documented in .env.example and embedded
      # in official T3 Code builds. They are not secrets.
      T3CODE_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsudDMuY29kZXMk
      T3CODE_CLERK_JWT_TEMPLATE: t3-relay
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: hzxSgY2cH10sDU2r
      T3CODE_RELAY_URL: https://relay.t3.codes

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/pi-provider
          fetch-depth: 0

      - name: Merge latest upstream main
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags upstream main
          git -c user.name=t3-ci -c user.email=t3-ci@users.noreply.github.com merge --no-commit --no-ff upstream/main

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        shell: pwsh
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Ensure Electron runtime
        shell: pwsh
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - id: version
        name: Resolve nightly version
        shell: bash
        run: echo "version=0.0.42-nightly.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Download WSL node-pty prebuild
        uses: actions/download-artifact@v4
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild

      - name: Build unsigned installer
        shell: pwsh
        run: >-
          vp run dist:desktop:artifact
          --platform win
          --target nsis
          --arch x64
          --wsl-prebuild "${{ github.workspace }}\wsl-prebuild\pty.node"
          --build-version "${{ steps.version.outputs.version }}"
          --verbose

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: t3-code-windows-x64
          retention-days: 30
          path: |
            release/*.exe
            release/*.blockmap
            release/*.yml
          if-no-files-found: error

  release:
    name: Publish nightly release
    needs: [check-upstream, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: t3-code-windows-x64
          path: release

      - name: Publish GitHub nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: T3 Code Pi Nightly ${{ needs.build.outputs.version }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          body: |
            Automated unsigned Windows build for the Pi provider branch.

            upstream-main-sha: ${{ needs.build.outputs.upstream_sha }}
            feature-ref: feat/pi-provider
          files: release/*
          fail_on_unmatched_files: true
