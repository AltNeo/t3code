name: Windows Pi nightly

# Builds an unsigned Windows NSIS installer for this fork's `feat/pi-provider`
# branch (rebased onto upstream main at build time) and publishes it as a
# prerelease so fork users can update.
#
# Two things are deliberate here:
#
# 1. Every runner is GitHub-hosted (`ubuntu-24.04`, `windows-2025`). The
#    `blacksmith-*` labels used by upstream queue forever for this fork.
# 2. The Windows installer embeds the WSL backend, which means it needs the
#    Linux CLI archive as its runtime payload. Upstream replaced the old
#    `--wsl-prebuild` (a bare `pty.node`) with `--wsl-runtime` (the full Linux
#    CLI archive, `t3-<version>-linux-<arch>.tar.gz`), so this workflow builds
#    that archive on a Linux runner and hands it to the Windows build.
#
# The version is resolved once in `check-upstream` and shared by both build
# jobs: `scripts/build-desktop-artifact.ts` rejects a WSL runtime archive whose
# single top-level directory is not named `t3-<build-version>-linux-x64`, so
# the archive version and `--build-version` have to agree exactly.

on:
  workflow_dispatch:
  schedule:
    # Fork workflows cannot receive upstream push events directly; poll hourly.
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  check-upstream:
    name: Check upstream main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - id: check
        name: Check for a new upstream commit
        uses: actions/github-script@v8
        with:
          script: |
            const upstream = await github.rest.repos.getCommit({
              owner: "pingdotgg",
              repo: "t3code",
              ref: "main",
            });
            const upstreamSha = upstream.data.sha;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const latestPiNightly = releases.find(
              (release) =>
                release.prerelease &&
                !release.draft &&
                release.name.startsWith("T3 Code Pi Nightly") &&
                /upstream-main-sha: [0-9a-f]{40}/i.test(release.body ?? ""),
            );
            const previousSha = latestPiNightly?.body?.match(
              /upstream-main-sha: ([0-9a-f]{40})/i,
            )?.[1];
            const shouldBuild = context.eventName !== "schedule" || previousSha !== upstreamSha;
            // Resolved here so both build jobs use the identical string: the
            // Windows build stamps it as the app version and the Linux job
            // names the CLI archive after it.
            const date = new Date().toISOString().slice(0, 10).replace(/-/g, "");
            const version = `0.0.42-nightly.${date}.${context.runNumber}`;
            core.setOutput("should_build", String(shouldBuild));
            core.setOutput("upstream_sha", upstreamSha);
            core.setOutput("version", version);
            core.notice(
              `${shouldBuild ? "Building" : "Skipping"} upstream main ${upstreamSha} as ${version}`,
            );

  build-linux-cli:
    name: Build Linux CLI archive (WSL runtime)
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # These are public identifiers, documented in .env.example and embedded
      # in official T3 Code builds. They are not secrets.
      T3CODE_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsudDMuY29kZXMk
      T3CODE_CLERK_JWT_TEMPLATE: t3-relay
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: hzxSgY2cH10sDU2r
      T3CODE_RELAY_URL: https://relay.t3.codes

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/pi-provider
          fetch-depth: 0

      - name: Merge latest upstream main
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags upstream main
          git -c user.name=t3-ci -c user.email=t3-ci@users.noreply.github.com merge --no-commit --no-ff upstream/main

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...

      - name: Align package versions to the nightly version
        # The archive smoke test runs `t3 --version` and expects this version,
        # which the executable reports from the package manifests bundled at
        # build time.
        run: node scripts/update-release-package-versions.ts "${{ needs.check-upstream.outputs.version }}"

      - name: Build server and web client
        # Builds @t3tools/web#build, then the t3 bundle plus apps/server/dist/client.
        run: vp run --filter t3 build

      - name: Build CLI single-executable
        shell: bash
        env:
          # The exact version, not a major: vp downloads it from nodejs.org/dist
          # on the runner, and only exact versions have a dist directory. Keep
          # in step with SEA_NODE_VERSION in apps/server/vite.config.ts.
          VP_NODE_VERSION: "26.8.2"
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build resource monitor
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-unknown-linux-gnu

      - name: Stage resource monitor for the CLI archive
        shell: bash
        run: |
          set -euo pipefail
          target_dir="$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          mkdir -p "$target_dir"
          cp "native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor" "$target_dir/t3-resource-monitor"
          file "$target_dir/t3-resource-monitor"

      - name: Build CLI archive
        run: >-
          node scripts/build-cli-archive.ts
          --platform linux
          --arch x64
          --version "${{ needs.check-upstream.outputs.version }}"
          --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor"
          --output-dir release-cli

      - name: Smoke-test CLI archive
        shell: bash
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "${{ needs.check-upstream.outputs.version }}"

      - name: Upload CLI archive
        uses: actions/upload-artifact@v4
        with:
          name: cli-linux-x64
          path: release-cli/*
          if-no-files-found: error

  build:
    name: Build Windows installer
    needs: [check-upstream, build-linux-cli]
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      version: ${{ needs.check-upstream.outputs.version }}
      upstream_sha: ${{ needs.check-upstream.outputs.upstream_sha }}
    env:
      # These are public identifiers, documented in .env.example and embedded
      # in official T3 Code builds. They are not secrets.
      T3CODE_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsudDMuY29kZXMk
      T3CODE_CLERK_JWT_TEMPLATE: t3-relay
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: hzxSgY2cH10sDU2r
      T3CODE_RELAY_URL: https://relay.t3.codes

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/pi-provider
          fetch-depth: 0

      - name: Merge latest upstream main
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags upstream main
          git -c user.name=t3-ci -c user.email=t3-ci@users.noreply.github.com merge --no-commit --no-ff upstream/main

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        shell: pwsh
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Ensure Electron runtime
        shell: pwsh
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Download Linux CLI archive for WSL
        # Embedded as the WSL backend's runtime. The archive is built by
        # build-linux-cli from the same commit and the same version string.
        uses: actions/download-artifact@v4
        with:
          name: cli-linux-x64
          path: wsl-runtime

      - name: Build unsigned installer
        shell: pwsh
        run: >-
          vp run dist:desktop:artifact
          --platform win
          --target nsis
          --arch x64
          --wsl-runtime "${{ github.workspace }}\wsl-runtime\t3-${{ needs.check-upstream.outputs.version }}-linux-x64.tar.gz"
          --build-version "${{ needs.check-upstream.outputs.version }}"
          --verbose

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: t3-code-windows-x64
          retention-days: 30
          path: |
            release/*.exe
            release/*.blockmap
            release/*.yml
          if-no-files-found: error

  release:
    name: Publish nightly release
    needs: [check-upstream, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: t3-code-windows-x64
          path: release

      - name: Publish GitHub nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: T3 Code Pi Nightly ${{ needs.build.outputs.version }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          body: |
            Automated unsigned Windows build for the Pi provider branch, with the WSL backend (embedded Linux CLI runtime).

            upstream-main-sha: ${{ needs.build.outputs.upstream_sha }}
            feature-ref: feat/pi-provider
          files: release/*
          fail_on_unmatched_files: true
